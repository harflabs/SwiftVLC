name: Tests

# Run once per change, not twice. `on: [push, pull_request]` would fire
# both events whenever a PR branch is pushed (push → `refs/heads/<branch>`,
# pull_request → `refs/pull/<n>/merge`), doubling CI minutes. Restricting
# `push` to `main` means branch pushes only run under the PR; `main` still
# gets CI on direct pushes / merges.
on:
  workflow_dispatch:
    inputs:
      build-native:
        description: Build the patched macOS engine and run Swift behavior tests against it
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default every job to immutable source/release reads. Jobs that consume an
# exact same-repository release candidate opt into `contents: write` below:
# GitHub deliberately hides draft releases from read-only installation tokens.
permissions:
  contents: read

# Cancel superseded runs on the same branch so stale pushes don't burn billing.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_NATIVE: ${{ inputs.build-native && 'true' || 'false' }}
          CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/') && 'true' || 'false' }}
        run: python3 -B scripts/ci/native-changes.py

  native-build:
    needs: native-changes
    if: needs.native-changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.4"
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: "6.3.1"
      - name: Install native build prerequisites
        timeout-minutes: 10
        run: |
          brew install autoconf automake libtool gettext pkg-config cmake meson ninja nasm
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Record native build environment
        run: python3 -B scripts/ci/environment.py
      - name: Build patched macOS engine and source-linked probes
        timeout-minutes: 155
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-root" .build/ci-results
          ./scripts/ci-run-with-timeouts.py 9000 900 \
            ./scripts/build-libvlc.sh --build-root="$RUNNER_TEMP/native-root" --clean-build --macos-only \
            2>&1 | tee .build/ci-results/native-build.log
      - name: Test Swift behavior against the new engine
        timeout-minutes: 12
        env:
          CI: "true"
        run: |
          python3 -B scripts/ci/use-local-native.py
          ./scripts/ci-run-with-timeouts.py 600 180 \
            xcrun --toolchain "$TOOLCHAINS" swift test --no-parallel \
            --xunit-output .build/ci-results/native.xml
          python3 -B scripts/ci/audit-test-results.py \
            --xunit .build/ci-results/native-swift-testing.xml \
            --contract scripts/ci/headless-test-contracts.json \
            --test-source-root Tests/SwiftVLCTests \
            --json-output .build/ci-results/native-accounting.json \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain native validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiled-native-evidence
          path: |
            .build/ci-results
            Vendor/libvlc-provenance.json
          retention-days: 14

  # Style and formatting gate. Cheap (<1 min) and runs in parallel with
  # the test job so a style violation surfaces immediately without
  # waiting for the test suite. swiftlint+swiftformat configs live in
  # `.swiftlint.yml` and `.swiftformat`; both run with --strict so
  # warnings are treated as errors.
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Install pinned SwiftLint and SwiftFormat
        timeout-minutes: 3
        env:
          SWIFTLINT_VERSION: "0.65.1"
          SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
          SWIFTFORMAT_VERSION: "0.63.0"
          SWIFTFORMAT_SHA256: "28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f"
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/swift-style-tools"
          mkdir -p "$tool_dir/bin"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            --output "$tool_dir/swiftlint.zip"
          printf '%s  %s\n' "$SWIFTLINT_SHA256" "$tool_dir/swiftlint.zip" \
            | shasum -a 256 --check

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            --output "$tool_dir/swiftformat.zip"
          printf '%s  %s\n' "$SWIFTFORMAT_SHA256" "$tool_dir/swiftformat.zip" \
            | shasum -a 256 --check

          unzip -q "$tool_dir/swiftlint.zip" -d "$tool_dir/bin"
          unzip -q "$tool_dir/swiftformat.zip" -d "$tool_dir/bin"
          chmod 0755 "$tool_dir/bin/swiftlint" "$tool_dir/bin/swiftformat"
          printf '%s\n' "$tool_dir/bin" >> "$GITHUB_PATH"
          "$tool_dir/bin/swiftlint" --version
          "$tool_dir/bin/swiftformat" --version

      # Both run scoped to the Swift source roots. Without scoping,
      # swiftlint scans `scripts/.build-libvlc/` (the upstream VLC source
      # tree, multi-GB of C and headers), which makes it run for many
      # minutes and consume gigabytes of RAM.
      - name: SwiftLint
        timeout-minutes: 2
        run: swiftlint lint --strict --quiet Sources Tests Showcase

      - name: SwiftFormat
        timeout-minutes: 2
        run: swiftformat Sources Tests Showcase --lint --strict

      # Catches manifest drift on the pull request rather than at release time,
      # which is the whole point: a patch added without a manifest entry would
      # otherwise only fail once someone tried to cut a release.
      - name: Patch manifest
        timeout-minutes: 1
        run: ./scripts/verify-patch-manifest.sh >/dev/null

      - name: Release integrity
        # The fault matrix creates and merges several isolated repositories.
        # A warm developer machine finishes in roughly 90 seconds, but a
        # provisioned runner can cross two minutes after filesystem and git
        # startup. Keep a bounded ceiling without killing a healthy matrix.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_RELEASE_CANDIDATE_LINT: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) && '1' || '' }}
        run: ./scripts/tests/release-integrity.sh

      - name: Test native filesystem safety helpers
        timeout-minutes: 1
        run: |
          python3 -B -m unittest \
            scripts/tests/test_verify_libvlc_build_paths.py \
            scripts/tests/test_detach_managed_build_directory.py

      - name: Test native build-root safety
        timeout-minutes: 1
        run: ./scripts/tests/build-libvlc-build-root.sh

      # Reports engine patches that are in the tree but not in the exact binary
      # release declared by the checkout. Warns rather
      # than fails: patches legitimately land before the release carrying them,
      # so failing would wedge every PR. See the script header for the
      # regression that made this worth surfacing.
      - name: Engine patch coverage
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_RELEASE_CANDIDATE_LINT: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) && '1' || '' }}
        run: ./scripts/check-engine-coverage.sh

      # The accounting parser is part of the PR gate, so test it independently
      # of the Swift build. A parser regression must not turn a broad but skipped
      # run into a false green result.
      - name: Test CI behavior-accounting gate
        timeout-minutes: 1
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      # The real-device lane is intentionally local, but its fail-closed policy,
      # report assembly, feature/risk mapping, and device parsing are pure
      # Python and cheap enough to verify on every pull request.
      - name: Test physical-qualification policy
        # Cold macOS runners currently take about two minutes (118-121s).
        # Leave a bounded margin so scheduler noise cannot turn a green suite
        # into a retry that costs more than simply allowing it to finish.
        timeout-minutes: 4
        run: python3 -B -m unittest discover -s scripts/qualification/tests -p 'test_*.py'

  # Showcase apps build gate. Catches API breakage that the SwiftVLC
  # test suite wouldn't notice — e.g. renaming a public symbol used
  # only by the Showcase, or breaking the Showcase's Mac/iOS/tvOS/visionOS
  # build settings. We compile (not test) every scheme.
  #
  # Schemes are pinned in the Showcase Xcode project to a published
  # `SwiftVLC` version. `setup-dev.sh` flips it to the local repo
  # checkout so the Showcase compiles against the in-PR code rather
  # than the last release.
  showcase:
    # Pull requests compile the iOS Showcase in `ios-build` below. The full
    # four-platform matrix also runs on release candidates, before publication.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) }}
    # Xcode's package graph resolver checks Package.swift's tools-version
    # with Xcode's built-in SwiftPM, not the open-source toolchain passed
    # through `-toolchain`. SwiftVLC's manifest requires Swift 6.3, so the
    # Showcase matrix must run on an image with Xcode 26.4+.
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scheme: [iOS, macOS, tvOS, visionOS]
        include:
          - scheme: iOS
            destination: "generic/platform=iOS"
          - scheme: macOS
            destination: "generic/platform=macOS"
          - scheme: tvOS
            destination: "generic/platform=tvOS"
          - scheme: visionOS
            destination: "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      - name: Print toolchain
        id: environment
        timeout-minutes: 1
        run: python3 -B scripts/ci/environment.py

      # The libvlc xcframework dominates the artifact cache.
      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: Vendor
          key: libvlc-xcf-vendor-v2-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      # Download the libvlc xcframework + flip the Showcase project to
      # the local SwiftVLC checkout so we compile against in-PR code.
      - name: Set up Vendor + local Swift package
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/setup-dev.sh

      - name: Build Showcase (${{ matrix.scheme }})
        timeout-minutes: 20
        run: |
          xcodebuild build \
            -project Showcase/SwiftVLCShowcase.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # iOS test-target compile gate. The `test` job below runs `swift test` on
  # the macOS host, which only ever type-checks the macOS slice of the test
  # target — the iOS-gated tests (`#if canImport(UIKit)`, e.g. the native
  # PiP suite) and the iOS branches of Sources are never compiled there, so
  # an iOS-only break can reach `main` unseen. `build-for-testing` on an iOS
  # Simulator destination compiles both Sources and Tests for iOS and fails
  # CI on any iOS-only break.
  ios-build:
    # xcodebuild resolves the package with Xcode's built-in SwiftPM, which
    # must understand the manifest's Swift 6.3 tools-version — needs Xcode
    # 26.4+, hence macos-26 (same rationale as the showcase job above).
    runs-on: macos-26
    # Reading a draft release requires push-level repository access. GitHub
    # downgrades fork pull-request tokens to read-only, and draft authorization
    # below independently requires the exact same-repository candidate PR.
    permissions:
      contents: write
    # Pull requests have 67 minutes of explicit per-step ceilings below. Keep
    # one provisioned runner, but leave enough job-level headroom for every
    # bounded step to complete instead of cutting the job off at 30 minutes.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: Vendor
          key: libvlc-xcf-vendor-v2-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      - name: Set up Vendor + local Swift package
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/setup-dev.sh

      # build-for-testing (not plain build) so the SwiftVLCTests target is
      # compiled too — that is what type-checks the iOS-gated test code.
      - name: Build SwiftVLC + tests for iOS Simulator
        timeout-minutes: 20
        run: |
          xcodebuild build-for-testing \
            -scheme SwiftVLC \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Pull requests need compile evidence for platform-gated source and test
      # code without booting more runtimes. All three destinations use
      # build-for-testing so SwiftVLCTests is type-checked; runtime tvOS
      # execution remains in tvos-test.
      - name: Compile Mac Catalyst and tvOS/visionOS tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: |
          xcodebuild build-for-testing \
            -scheme SwiftVLC \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild build-for-testing \
            -scheme SwiftVLC \
            -destination "generic/platform=tvOS Simulator" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild build-for-testing \
            -scheme SwiftVLC \
            -destination "generic/platform=visionOS" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Reuse this already-provisioned Xcode/Vendor job for the one Showcase
      # build required on a pull request. The other Apple platforms run in the
      # post-merge/manual matrix above.
      # Build both SDK variants: simulator-only compilation erases every
      # `#if targetEnvironment(simulator) ... #else` device branch and can let
      # a broken physical qualification path reach main. Neither build boots a
      # simulator or adds another billed runner.
      - name: Compile iOS Showcase and qualification UI tests for both SDKs
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        run: |
          xcodebuild build-for-testing \
            -project Showcase/SwiftVLCShowcase.xcodeproj \
            -scheme iOS \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild build-for-testing \
            -project Showcase/SwiftVLCShowcase.xcodeproj \
            -scheme iOS \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # tvOS test-run gate. The `test` job below runs `swift test` on the macOS
  # host, which only type-checks the macOS slice of the test target — the
  # tvOS slices of Sources and Tests are never *executed* anywhere else.
  # This job runs the SwiftVLCTests suite on a tvOS simulator against real
  # libVLC, so tvOS-only runtime breakage can't reach `main` unseen.
  tvos-test:
    # Run tvOS behavior tests on release candidates before publication.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) }}
    # Same rationale as ios-build: xcodebuild resolves the package with
    # Xcode's built-in SwiftPM, which must understand the manifest's Swift
    # 6.3 tools-version — needs Xcode 26.4+, hence macos-26.
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: Vendor
          key: libvlc-xcf-vendor-v2-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      - name: Set up Vendor + local Swift package
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/setup-dev.sh

      # TEST_RUNNER_CI=true is load-bearing: xcodebuild strips the
      # TEST_RUNNER_ prefix from variables in its own *environment* and
      # forwards them into the test process, so the test process sees
      # CI=true. That is how TestCondition.canPlayMedia (which reads CI)
      # makes the playback-gated tests self-skip on the headless runner —
      # without it those tests would hang or fail for lack of video
      # output. It must be set via `env:` — passing it as an xcodebuild
      # command-line argument would make it a build setting, which is
      # never forwarded.
      - name: Run tests on tvOS Simulator
        timeout-minutes: 25
        env:
          TEST_RUNNER_CI: "true"
        run: |
          set -euo pipefail
          # The default tvOS simulator name varies across runner images
          # ("Apple TV" vs "Apple TV 4K (3rd generation)"), so resolve an
          # available device by UDID instead of hardcoding a fragile name.
          udid=$(xcrun simctl list -j devices available \
            | jq -r 'first(.devices | to_entries[] | select(.key | test("tvOS")) | .value[] | select(.isAvailable) | .udid) // empty')
          if [ -z "$udid" ]; then
            echo "No available tvOS Simulator device found on this runner:" >&2
            xcrun simctl list devices tvOS >&2
            exit 1
          fi
          echo "Using tvOS Simulator $udid"
          xcrun simctl boot "$udid" || true
          xcodebuild test \
            -scheme SwiftVLC \
            -destination "id=$udid" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  test:
    # This existing required check cannot pass if new native integration fails.
    needs: [native-changes, native-build]
    if: ${{ always() }}
    # Pin the runner family and SDK. SwiftVLC requires Swift 6.3 (Package.swift tools-version), and the current
    # 6.3 patch is Swift 6.3.1 in Xcode 26.4.1. GHA runner toolchains
    # can lag, so we install the Swift 6.3.1 open-source toolchain from
    # swift.org and activate it via the TOOLCHAINS env var.
    runs-on: macos-26
    # See ios-build: write-level contents permission makes the draft visible;
    # it does not replace the resolver's exact candidate identity checks.
    permissions:
      contents: write
    # Absolute ceiling — the job CANNOT run longer than this. The wrapper
    # script and step timeouts below enforce tighter bounds; this is the
    # last line of defense if those fail.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Require native validation outcome
        env:
          SELECTION: ${{ needs.native-changes.result }}
          NATIVE: ${{ needs.native-build.result }}
        run: |
          test "$SELECTION" = success
          test "$NATIVE" = success || test "$NATIVE" = skipped

      # Pin Xcode for SDKs / linker / simulators. Current GHA runners
      # can lag behind the package's tools-version 6.3 manifest, so we
      # install the Swift 6.3.1 open-source toolchain separately below
      # and invoke it through
      # `xcrun --toolchain`.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      # Install Swift 6.3.1 open-source toolchain from swift.org.
      # Exports $TOOLCHAINS — later steps use `xcrun --toolchain` to run
      # Swift 6.3.1 on top of the already-set-up Xcode SDKs.
      #
      # Pinned to v1.14.0 (latest as of 2026-04-27) rather than @latest
      # or @v1 so a compromised or breaking release of the action cannot
      # silently affect our CI. Bump deliberately via Dependabot or a
      # manual PR.
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        timeout-minutes: 8
        with:
          swift-version: "6.3.1"

      - name: Print toolchain
        id: environment
        timeout-minutes: 1
        run: python3 -B scripts/ci/environment.py

      # Restore before candidate verification so setup-dev validates any cached
      # Vendor tree and replaces it on checksum/tree-digest mismatch. Restoring
      # after verification could overwrite the bytes that were just checked.
      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: |
            .build/artifacts
            Vendor
          key: libvlc-xcf-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      # CI tests the exact published xcframework declared by this checkout (or
      # SWIFTVLC_RELEASE_TAG), regardless of whether a developer had previously
      # flipped Package.swift to Vendor/ locally.
      # Only the libvlc binaryTarget is rewritten; other Package.swift
      # edits are preserved.
      - name: Select declared libvlc release
        id: xcf
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/ci-use-released-xcframework.sh

      # Compiled outputs — safe to cache across runs with the same toolchain
      # and source state.
      - name: Cache build products
        if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          path: |
            .build/debug
            .build/arm64-apple-macosx
            .build/x86_64-apple-macosx
          key: spm-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.fingerprint }}-${{ steps.xcf.outputs.sha }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Sources/**/*.c', 'Sources/**/*.h', 'Tests/**/*.swift') }}

      - name: Cache SPM dependencies
        if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 2
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-deps-${{ runner.os }}-${{ steps.xcf.outputs.sha }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Clean candidate build links
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) }}
        timeout-minutes: 2
        run: xcrun --toolchain "$TOOLCHAINS" swift package clean

      # swift test is run through ci-run-with-timeouts.py which enforces
      # both a wall-clock ceiling and an idle watchdog. If either fires
      # the entire process group is SIGKILLed.
      #
      #   wall_clock = 600s  (10 min)  — enough for fresh xcf download
      #                                  + cold build + test run on a
      #                                  slow runner; well inside the
      #                                  20-minute job ceiling.
      #   idle       = 180s  (3 min)   — swift test emits a line per
      #                                  test / suite; 3 min of silence
      #                                  means the test process is stuck.
      #
      # --no-parallel is load-bearing: `Player` is `@MainActor`, so
      # integration tests that drive libVLC to `.playing` all compete
      # for the same actor under Swift Testing's default parallel mode.
      # On a GHA runner that contention stretches a 200 ms test into a
      # multi-second timeout. Running serially takes ~45 s for the whole
      # suite with zero flakes — fractions of a cent in GHA billing and
      # vastly more predictable than paying for periodic retries.
      - name: Run tests (wall-clock + idle timeouts)
        id: swift-tests
        timeout-minutes: 12
        env:
          # TestCondition.canPlayMedia reads CI to skip playback tests that
          # need video output — CI macOS runners are headless.
          CI: "true"
        # `xcrun --toolchain "$TOOLCHAINS" swift test` routes through the
        # Swift 6.3.1 toolchain installed above, while still using the
        # Xcode-provided SDKs/simulators.
        run: |
          mkdir -p .build/ci-results
          ./scripts/ci-run-with-timeouts.py 600 180 \
            xcrun --toolchain "$TOOLCHAINS" swift test \
              --no-parallel \
              --enable-code-coverage \
              --xunit-output .build/ci-results/swiftpm.xml

      # Test count alone is not evidence: many real-output tests intentionally
      # skip under CI=true. Require the headless contracts that cross meaningful
      # native boundaries to have actually passed, publish every reported skip,
      # and reject growth in the source-level canPlayMedia skip debt. This runs
      # even after a failing test step so the job summary still explains what ran.
      - name: Audit executed and skipped behavior contracts
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          # SwiftPM appends the runner kind to the requested xUnit basename.
          python3 -B scripts/ci/audit-test-results.py \
            --xunit .build/ci-results/swiftpm-swift-testing.xml \
            --test-step-outcome "${{ steps.swift-tests.outcome }}" \
            --contract scripts/ci/headless-test-contracts.json \
            --test-source-root Tests/SwiftVLCTests \
            --json-output .build/ci-results/test-accounting.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test execution accounting
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swiftpm-test-accounting
          path: .build/ci-results
          if-no-files-found: warn
          retention-days: 14

      - name: Export coverage report
        timeout-minutes: 1
        run: ./scripts/export-lcov.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .build/local-quality/coverage/lcov.info
          disable_search: true
          flags: swiftpm
          name: swiftvlc-swiftpm

      # The flag matches the `swift test` invocation above. Without it SwiftPM
      # sees a different build configuration and recompiles the entire module
      # from scratch, which is what previously pushed this step past its
      # timeout — the docs themselves were never the slow part.
      - name: Doc coverage
        timeout-minutes: 3
        env:
          DOC_COVERAGE_BUILD_FLAGS: --enable-code-coverage
        run: ./scripts/doc-coverage.sh

  summary:
    if: ${{ always() }}
    needs: [lint, ios-build, test, showcase, tvos-test, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize CI subsystems
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = {"lint": "Style and release/qualification tooling", "test": "Swift behavior and documentation", "ios-build": "Apple platform compilation", "showcase": "Showcase platform matrix", "tvos-test": "tvOS runtime", "native-build": "Compiled native integration"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("## CI results\n\n| Subsystem | Result |\n|---|---|\n")
              for job, value in json.loads(os.environ["JOBS"]).items():
                  report.write(f"| {labels[job]} | {value['result']} |\n")
          PY
