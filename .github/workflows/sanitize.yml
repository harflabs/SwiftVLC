name: Sanitizers

# Sanitizer runs are slower than the regular test job (TSan instruments
# every memory access, ~3-5x slowdown; ASan ~2x slowdown). Pull requests run
# the deterministic race/lifecycle suites without instrumentation; the two
# expensive sanitizer variants run after merge, manually, and weekly.
#
# Scoped to the race/lifecycle/memory test suites — these are the suites
# that exist *because* of races. Running the full test suite under
# sanitizers would inflate CI minutes without proportional benefit.
on:
  workflow_dispatch:
  # Release candidates run once through their protected PR. Other pull
  # requests create only a skipped workflow row and consume no macOS runner;
  # their deterministic race suites remain in Tests as described above.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Sources/SwiftVLC/Player/**'
      - 'Sources/SwiftVLC/PiP/**'
      - 'Sources/SwiftVLC/Core/**'
      - 'Sources/SwiftVLC/Media/Media.swift'
      - 'Sources/SwiftVLC/Media/ThumbnailRequest.swift'
      - 'Sources/SwiftVLC/Discovery/**'
      - 'Sources/SwiftVLC/Playlist/**'
      - 'Sources/SwiftVLC/Audio/Equalizer.swift'
      - 'Sources/SwiftVLC/Video/VideoView.swift'
      - 'Tests/SwiftVLCTests/**Race**'
      - 'Tests/SwiftVLCTests/**Stress**'
      - 'Tests/SwiftVLCTests/**Memory**'
      - 'Tests/SwiftVLCTests/**Lifecycle**'
      - 'Package.swift'
      - '.github/workflows/sanitize.yml'
  schedule:
    # Weekly run on Monday 03:00 UTC catches sanitizer regressions in
    # libVLC, Swift toolchain, or transitive deps even when no PR opens.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    runs-on: macos-26
    # GitHub hides draft releases from read-only installation tokens. The
    # resolver below separately authenticates and binds the exact candidate.
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        timeout-minutes: 8
        with:
          swift-version: "6.3.1"

      - name: Print toolchain
        id: environment
        timeout-minutes: 1
        run: python3 -B scripts/ci/environment.py

      # Restore before candidate verification so setup-dev validates/replaces
      # cached Vendor bytes instead of a cache overwriting verified bytes.
      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: |
            .build/artifacts
            Vendor
          key: libvlc-xcf-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      - name: Select declared libvlc release
        id: xcf
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/ci-use-released-xcframework.sh

      # Sanitizer-instrumented build products differ from the standard
      # debug build, so cache them separately. Cache key includes the
      # sanitizer name to avoid TSan and ASan stomping each other.
      - name: Cache build products (sanitizer-${{ matrix.sanitizer }})
        if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          path: |
            .build/debug
            .build/arm64-apple-macosx
          key: spm-build-sanitizer-v3-${{ runner.arch }}-${{ steps.environment.outputs.fingerprint }}-${{ matrix.sanitizer }}-${{ steps.xcf.outputs.sha }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Sources/**/*.c', 'Sources/**/*.h', 'Tests/**/*.swift') }}

      - name: Cache SPM dependencies
        if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 2
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-deps-${{ runner.os }}-${{ steps.xcf.outputs.sha }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Clean candidate build links
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/')) }}
        timeout-minutes: 2
        run: xcrun --toolchain "$TOOLCHAINS" swift package clean

      # Run only the suites that exist *because* of races/lifecycle/memory
      # concerns. The general test suite runs unsanitized in `test.yml`.
      #
      # Playback-driven race suites (PlayerCleanupRaceTests,
      # AudioOutputRaceTests, …) are gated on `TestCondition.canPlayMedia`
      # and self-skip under CI=true, so the sanitizers never see them here.
      # PlaybackFreeTeardownRaceTests exists to cover the stop, native-
      # handle-swap, and offloaded-deinit paths without playback so they
      # run under both sanitizers. The residual gap is real-playback
      # stop/teardown, which remains device/local-only.
      #
      # `--no-parallel` per the same rationale as the test job: serialized
      # runs avoid main-actor contention that masks real races as timeouts.
      #
      # The 25-minute wall clock is generous because sanitizer-instrumented
      # builds are 3-5x slower; the per-suite time limits inside the tests
      # are NOT scaled, so a sanitizer pass that legitimately needs more
      # time per test will fail with a clearer signal than a wall-clock kill.
      - name: Run sanitized race tests
        timeout-minutes: 25
        env:
          CI: "true"
        run: |
          ./scripts/ci-run-with-timeouts.py 1500 300 \
            xcrun --toolchain "$TOOLCHAINS" swift test \
              --sanitize=${{ matrix.sanitizer }} \
              --no-parallel \
              --filter "RaceTests|StressTests|MemoryAndRetainTests|MemoryPressureTests|LifecycleStressTests"
